<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resonance 養成手帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap">
<style>
/* Layout: a classic JRPG menu screen. World-map chapter strip on top, then a
   party roster of blue menu windows. Deliberately single-theme (night-sky
   menu world), so colours are set explicitly and color-scheme is dark. */
:root {
  color-scheme: dark;
  /* colour */
  --ink:        #070a1f;   /* page ground, night sky            */
  --ink-2:      #10153a;   /* recessed wells inside windows     */
  --win-top:    #2c3fb6;   /* menu window gradient, top         */
  --win-bot:    #0c1458;   /* menu window gradient, bottom      */
  --frame:      #e9ecff;   /* window border                     */
  --frame-dim:  #7d86c4;   /* inner bevel, disabled borders     */
  --text:       #f5f6ff;
  --dim:        #aab1e2;
  --gold:       #ffd65a;   /* cursor, filled pips, selection    */
  --gold-dim:   #8f7a3a;   /* pips already trained last chapter */
  --core:       #ff6262;
  --rec:        #62d3ff;
  --opt:        #a3a8c8;
  --hi:         #7dff94;
  --mid:        #ffd65a;
  --lo:         #ff9563;
  --rar-ssr:    #ffcc33;
  --rar-sr:     #c9b6ff;
  --rar-r:      #d89a5b;
  --rar-n:      #8e93ad;
  --shadow:     rgba(0,0,0,.45);
  /* type */
  --font-ui:  "DotGothic16", "PingFang TC", "Hiragino Sans", "Microsoft JhengHei", "Noto Sans TC", monospace;
  --font-num: "Press Start 2P", "DotGothic16", ui-monospace, monospace;
  --fs-xs: .75rem; --fs-s: .875rem; --fs-m: 1rem; --fs-l: 1.25rem; --fs-xl: 1.6rem;
  /* shape */
  --px: 3px;               /* one "chunky pixel" border unit   */
  --radius: 5px;
}
* { box-sizing: border-box; }
html { background: var(--ink); }
body {
  background:
    radial-gradient(1px 1px at 12% 18%, #ffffff55 50%, transparent 51%),
    radial-gradient(1px 1px at 68% 8%,  #ffffff44 50%, transparent 51%),
    radial-gradient(1px 1px at 84% 42%, #ffffff33 50%, transparent 51%),
    radial-gradient(1px 1px at 32% 64%, #ffffff33 50%, transparent 51%),
    var(--ink);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--fs-m);
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  -webkit-font-smoothing: none;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--rec); }
:focus-visible { outline: 2px dashed var(--gold); outline-offset: 3px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- the menu window ---------- */
.win {
  position: relative;
  background: linear-gradient(180deg, var(--win-top), var(--win-bot));
  border: var(--px) solid var(--frame);
  border-radius: var(--radius);
  box-shadow: 0 0 0 var(--px) var(--ink), inset 0 0 0 2px var(--frame-dim), 4px 6px 0 var(--px) var(--shadow);
  padding: 14px 16px;
}
.win-title {
  font-family: var(--font-num); font-size: .62rem; letter-spacing: .12em;
  color: var(--gold); text-transform: uppercase; margin: 0 0 8px;
}

/* hand cursor (pixel image generated at runtime into --hand) */
.cur { position: relative; }
.cur::before {
  content: ""; position: absolute; left: -30px; top: 50%;
  width: 28px; height: 18px; margin-top: -9px;
  background: var(--hand) no-repeat center / contain;
  image-rendering: pixelated;
  opacity: 0; pointer-events: none;
}
.cur:hover::before, .cur:focus-visible::before, .cur.is-on::before {
  opacity: 1; animation: point .6s steps(2) infinite;
}
@keyframes point { 50% { transform: translateX(-4px); } }

/* ---------- header ---------- */
header.top { display: grid; gap: 10px; grid-template-columns: 1fr auto; align-items: end; }
.logo { margin: 0; line-height: 1.25; text-wrap: balance; }
.logo .en { display: block; font-family: var(--font-num); font-size: clamp(.8rem, 2.6vw, 1.15rem); color: var(--gold);
  text-shadow: 3px 3px 0 #a3361a, 0 0 0 transparent; letter-spacing: .06em; }
.logo .zh { display: block; font-size: clamp(1.5rem, 5vw, 2.2rem); }
.meta { font-size: var(--fs-xs); color: var(--dim); text-align: right; display: grid; gap: 2px; }
.meta b { color: var(--text); font-weight: normal; }
@media (max-width: 560px) { header.top { grid-template-columns: 1fr; } .meta { text-align: left; } }

/* ---------- world map chapter select ---------- */
.map { padding: 14px 0 6px; }
.map .win-title { padding-inline: 16px; }
.map-scroll { overflow-x: auto; scroll-snap-type: x proximity; padding: 10px 16px 14px 40px; }
.map-row { display: flex; gap: 34px; position: relative; width: max-content; min-width: 100%; }
.map-row::before {           /* dotted overworld path */
  content: ""; position: absolute; left: 30px; right: 30px; top: 31px; height: 6px;
  background: repeating-linear-gradient(90deg, var(--frame-dim) 0 6px, transparent 6px 14px);
}
.node {
  position: relative; scroll-snap-align: center;
  display: grid; justify-items: center; gap: 6px; width: 112px;
  background: none; border: 0; padding: 0; cursor: pointer; text-align: center;
}
.node .pin {
  width: 62px; height: 62px; display: grid; place-items: center;
  background: var(--ink-2); border: var(--px) solid var(--frame-dim);
  box-shadow: 0 0 0 var(--px) var(--ink), inset -4px -4px 0 #0006;
  font-family: var(--font-num); font-size: 1rem; color: var(--dim);
  transition: transform .1s steps(2);
}
.node .ch-name { font-size: var(--fs-xs); line-height: 1.35; color: var(--dim); }
.node .lv { font-family: var(--font-num); font-size: .5rem; color: var(--frame-dim); }
.node .badge {
  position: absolute; top: -8px; right: 14px; font-family: var(--font-num); font-size: .5rem;
  background: var(--core); color: var(--ink); padding: 3px 4px; border: 2px solid var(--ink);
}
.node[aria-checked="true"] .pin {
  background: var(--gold); color: var(--ink); border-color: var(--frame);
  animation: pulse 1s steps(2) infinite;
}
.node[aria-checked="true"] .ch-name { color: var(--text); }
.node:hover .pin { transform: translateY(-3px); }
.node.cur::before { left: -26px; top: 31px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 var(--px) var(--ink), 0 0 0 7px #ffd65a55; } }

.chapter-info { display: grid; gap: 6px; }
.chapter-info h2 { margin: 0; font-size: var(--fs-xl); font-weight: normal; line-height: 1.3; text-wrap: balance; }
.chapter-info .orig { color: var(--dim); font-size: var(--fs-s); }
.chapter-info p { margin: 0; max-width: 65ch; }
.chapter-info .stats { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: var(--fs-s); color: var(--dim); }
.chapter-info .stats b { color: var(--gold); font-weight: normal; }

/* ---------- tabs & toolbar ---------- */
.tabs { display: flex; gap: 10px; flex-wrap: wrap; padding-left: 30px; }
.tab {
  background: var(--ink-2); border: var(--px) solid var(--frame-dim); border-bottom-width: 0;
  padding: 8px 16px 6px; cursor: pointer; color: var(--dim); border-radius: var(--radius) var(--radius) 0 0;
}
.tab[aria-selected="true"] { background: var(--win-top); color: var(--text); border-color: var(--frame); }
.panel { margin-top: -20px; display: grid; gap: 16px; }

.toolbar { display: grid; gap: 12px; }
.tool-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.tool-row > .lbl { font-family: var(--font-num); font-size: .55rem; color: var(--gold); min-width: 4.5em; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: var(--ink-2); border: 2px solid var(--frame-dim); padding: 3px 10px 2px; cursor: pointer;
  font-size: var(--fs-s); color: var(--dim);
}
.chip[aria-pressed="true"] { border-color: var(--gold); color: var(--ink); background: var(--gold); }
.chip.p-core[aria-pressed="true"] { background: var(--core); border-color: var(--core); }
.chip.p-recommended[aria-pressed="true"] { background: var(--rec); border-color: var(--rec); }
.chip.p-optional[aria-pressed="true"] { background: var(--opt); border-color: var(--opt); }
.pick { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-s); }
.pick select {
  background: var(--ink-2); border: 2px solid var(--frame-dim); padding: 3px 6px; border-radius: 0; max-width: 11em;
}
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: var(--fs-s); }
.toggle input { appearance: none; width: 18px; height: 18px; margin: 0; border: 2px solid var(--frame); background: var(--ink-2); display: grid; place-items: center; cursor: pointer; }
.toggle input:checked { background: var(--gold); box-shadow: inset 0 0 0 3px var(--ink-2); }
.count { font-size: var(--fs-s); color: var(--dim); }
.count b { color: var(--text); font-weight: normal; }

/* ---------- character cards ---------- */
.grid { display: grid; gap: 22px 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); align-items: start; }
.card { cursor: pointer; display: grid; gap: 10px; text-align: left; }
.card.cur::before { left: -26px; top: 46px; margin: 0; }
.card:hover { box-shadow: 0 0 0 var(--px) var(--ink), inset 0 0 0 2px var(--gold), 4px 6px 0 var(--px) var(--shadow); }
.card-top { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; }
.portrait {
  position: relative; width: 92px; height: 92px; display: grid; place-items: end center;
  background: var(--ink-2); border: var(--px) solid var(--rar, var(--rar-n));
  box-shadow: inset 0 0 0 2px #0008; overflow: hidden;
}
.portrait.rar-SSR { --rar: var(--rar-ssr); background: radial-gradient(circle at 50% 120%, #ffcc3333, transparent 60%), var(--ink-2); }
.portrait.rar-SR  { --rar: var(--rar-sr); }
.portrait.rar-R   { --rar: var(--rar-r); }
.who { min-width: 0; display: grid; gap: 2px; }
.name-row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.name { font-size: var(--fs-l); font-weight: normal; line-height: 1.2; }
.rar { font-family: var(--font-num); font-size: .5rem; padding: 2px 4px; color: var(--ink); background: var(--rar, var(--rar-n)); }
.rar.rar-SSR { --rar: var(--rar-ssr); } .rar.rar-SR { --rar: var(--rar-sr); } .rar.rar-R { --rar: var(--rar-r); }
.orig { color: var(--dim); font-size: var(--fs-xs); overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.tag { font-size: var(--fs-xs); padding: 0 6px; border: 2px solid var(--frame-dim); color: var(--dim); line-height: 1.5; }
.tag.el { border-color: var(--el); color: var(--el); }
.prio { font-size: var(--fs-s); padding: 2px 8px; border: 2px solid currentColor; white-space: nowrap; }
.prio.core { color: var(--core); background: #ff626222; }
.prio.recommended { color: var(--rec); }
.prio.optional { color: var(--opt); border-style: dashed; }

.equip { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; background: var(--ink-2); padding: 8px 10px; border: 2px solid #0007; }
.equip .ph-portrait { grid-row: span 2; width: 50px; height: 50px; display: grid; place-items: end center; position: relative; }
.equip .ph-name { display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; min-width: 0; }
.equip .ph-name small { color: var(--dim); font-size: var(--fs-xs); }
.equip .lbl, .meter .lbl { font-size: var(--fs-xs); color: var(--gold); }
.meter { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.meter .num { font-size: .6rem; }
.none { color: var(--dim); font-size: var(--fs-s); }

.pips { display: inline-flex; gap: 3px; }
.pip { width: 12px; height: 12px; background: var(--ink); border: 2px solid var(--frame-dim); }
.pip.on { background: var(--gold); border-color: var(--frame); box-shadow: inset -2px -2px 0 #b78a10; }
.pip.had { background: var(--gold-dim); border-color: var(--frame-dim); }
.pip.new { background: var(--gold); border-color: var(--frame); animation: blink .7s steps(2) infinite; }
@keyframes blink { 50% { background: var(--text); } }

/* awakening stars: pixel masks generated at runtime (--star-fill / --star-line) */
.stars { display: inline-flex; gap: 2px; align-items: center; }
.star { width: 15px; height: 15px; display: inline-block; background: var(--frame-dim);
  -webkit-mask: var(--star-line) center / contain no-repeat; mask: var(--star-line) center / contain no-repeat;
  image-rendering: pixelated; }
.star.on, .star.had, .star.new { -webkit-mask-image: var(--star-fill); mask-image: var(--star-fill); }
.star.on  { background: var(--gold); filter: drop-shadow(1px 1px 0 #8a5d00); }
.star.had { background: var(--gold-dim); }
.star.new { background: var(--gold); filter: drop-shadow(1px 1px 0 #8a5d00); animation: blink .7s steps(2) infinite; }
.stars.zero .star { opacity: .4; }
.star.sm { width: 11px; height: 11px; vertical-align: -1px; }
.card .equip > :not(.ph-portrait) { grid-column: 2; }
.awk-note { font-size: var(--fs-xs); color: var(--dim); line-height: 1.45; }
.awk-note::before { content: "※ "; color: var(--gold); }

.reason { margin: 0; font-size: var(--fs-s); color: var(--text); max-width: 65ch; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: var(--fs-xs); color: var(--dim); }
.conf { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.conf i { width: 4px; background: var(--frame-dim); }
.conf i:nth-child(1) { height: 5px; } .conf i:nth-child(2) { height: 8px; } .conf i:nth-child(3) { height: 12px; }
.conf.high i { background: var(--hi); }
.conf.medium i:nth-child(-n+2) { background: var(--mid); }
.conf.low i:nth-child(1) { background: var(--lo); }
.chg { font-family: var(--font-num); font-size: .5rem; padding: 3px 5px; color: var(--ink); animation: blink2 .9s steps(2) infinite; }
.chg.new { background: var(--hi); } .chg.swap { background: var(--rec); } .chg.up { background: var(--gold); }
@keyframes blink2 { 50% { opacity: .55; } }
.inh { border: 1px dashed var(--frame-dim); padding: 0 5px; }

.card.locked { cursor: default; background: linear-gradient(180deg, #2a2d48, #12142a); border-color: var(--frame-dim); }
.card.locked .spr-wrap { filter: brightness(0) drop-shadow(0 0 0 #000); opacity: .55; }
.card.locked .name, .card.locked .tags, .card.locked .orig { opacity: .5; }
.lock-msg { font-size: var(--fs-s); color: var(--dim); }

/* ---------- sprites ---------- */
.spr-wrap { position: relative; z-index: 1; display: block; line-height: 0; animation: bob 1s steps(2) infinite; animation-delay: var(--d, 0s); }
.spr-wrap canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
.portrait .spr-wrap canvas { width: 80px; height: 80px; }
.ph-portrait .spr-wrap canvas, .mini .spr-wrap canvas { width: 40px; height: 40px; }
.ph-portrait .spr-wrap { animation: float 1.6s steps(4) infinite; animation-delay: var(--d, 0s); }
.shadow { position: absolute; bottom: 3px; left: 50%; width: 54%; height: 6px; margin-left: -27%; background: #0009; border-radius: 50%; animation: shad 1s steps(2) infinite; animation-delay: var(--d, 0s); }
.ph-portrait .shadow { bottom: 0; animation: shad 1.6s steps(4) infinite; }
.card:hover .portrait .spr-wrap, .card:focus-visible .portrait .spr-wrap { animation: hop .45s steps(3) infinite; }
@keyframes bob   { 50% { transform: translateY(-2px) scaleY(1.02); } }
@keyframes float { 25% { transform: translateY(-2px); } 50% { transform: translateY(-4px); } 75% { transform: translateY(-2px); } }
@keyframes shad  { 50% { transform: scaleX(.85); } }
@keyframes hop   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* ---------- phantom tab ---------- */
.ph-card { display: grid; gap: 10px; }
.ph-card .card-top { grid-template-columns: auto 1fr; }
.ph-card .portrait .spr-wrap { animation: float 1.6s steps(4) infinite; animation-delay: var(--d, 0s); }
.users { display: flex; flex-wrap: wrap; gap: 8px; }
.user {
  display: inline-flex; align-items: center; gap: 6px; background: var(--ink-2); border: 2px solid var(--frame-dim);
  padding: 2px 8px 2px 2px; cursor: pointer; font-size: var(--fs-s);
}
.user:hover { border-color: var(--gold); }
.user .mini { width: 40px; height: 40px; display: grid; place-items: end center; }
.user .num { font-size: .55rem; color: var(--gold); }
.ph-card.locked { background: linear-gradient(180deg, #2a2d48, #12142a); border-color: var(--frame-dim); }
.ph-card.locked .spr-wrap { filter: brightness(0); opacity: .55; }

/* ---------- empty state ---------- */
.empty { text-align: center; display: grid; gap: 10px; justify-items: center; }
.btn { background: var(--ink-2); border: var(--px) solid var(--frame); padding: 6px 14px; cursor: pointer; }
.btn:hover { background: var(--gold); color: var(--ink); }

/* ---------- detail dialog ---------- */
dialog.win { color: var(--text); max-width: min(760px, calc(100vw - 32px)); width: 100%; max-height: calc(100dvh - 40px); overflow: auto; padding: 18px; }
dialog::backdrop { background: #04061acc; }
dialog[open] { animation: open .18s steps(3); }
@keyframes open { from { clip-path: inset(50% 0 50% 0); } to { clip-path: inset(0 0 0 0); } }
.dlg-head { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; }
.dlg-head .portrait { width: 120px; height: 120px; }
.dlg-head .portrait .spr-wrap canvas { width: 108px; height: 108px; }
.x { background: none; border: 2px solid var(--frame); width: 34px; height: 34px; cursor: pointer; font-family: var(--font-num); font-size: .7rem; }
.x:hover { background: var(--core); }
.facts { margin: 4px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: var(--fs-s); }
.facts dt { color: var(--gold); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
/* Vision x chapter matrix: scrolls inside its own box, Vision column stays put */
.matrix-wrap { overflow-x: auto; margin-top: 8px; border: 2px solid #0007; background: var(--ink-2); overscroll-behavior-x: contain; }
.matrix { border-collapse: separate; border-spacing: 0; font-size: var(--fs-xs); }
.matrix th, .matrix td { border-bottom: 1px dashed #ffffff22; border-right: 1px dashed #ffffff14; padding: 4px; text-align: center; font-weight: normal; }
.matrix thead th { color: var(--gold); white-space: nowrap; border-bottom: 2px solid var(--frame-dim); min-width: 58px; }
.matrix .m-v { position: sticky; left: 0; z-index: 2; background: var(--ink-2); text-align: left; width: 118px; min-width: 118px; max-width: 118px; box-shadow: 2px 0 0 var(--frame-dim); color: var(--text); }
.m-v-in { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 5px; align-items: center; line-height: 1.25; }
.m-v-in .mini { width: 28px; height: 28px; display: grid; place-items: end center; }
.m-v-in .spr-wrap { animation: none; }
.m-v-in .spr-wrap canvas { width: 28px; height: 28px; }
.m-v-in .shadow { display: none; }
.m-v-in b { font-weight: normal; display: block; overflow-wrap: anywhere; }
.m-v-in .pur { display: inline-block; margin-top: 2px; }
.matrix thead th.now { background: var(--gold); color: var(--ink); }
.matrix td.now { background: #ffd65a14; }
.m-cell { min-height: 40px; display: grid; justify-items: center; align-content: center; gap: 1px; line-height: 1.2; padding: 2px; border: 2px solid transparent; }
.m-mr { font-family: var(--font-num); font-size: .62rem; }
.m-aw { display: inline-flex; align-items: center; gap: 2px; font-family: var(--font-num); font-size: .5rem; color: var(--gold); }
.m-aw.zero { color: var(--dim); }
.m-aw.zero .star { opacity: .5; }
.m-tag { font-family: var(--font-num); font-size: .38rem; color: var(--ink); background: var(--gold); padding: 1px 2px; }
.m-cell.changed { border-color: var(--gold); background: #ffd65a2e; }
.m-cell.carry { opacity: .48; }
.m-cell.away { color: var(--lo); }
.m-cell.blank { color: var(--frame-dim); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: var(--fs-xs); color: var(--dim); }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: -1px; border: 2px solid var(--frame-dim); }
.legend i.changed { border-color: var(--gold); background: #ffd65a55; }
.legend i.carry { opacity: .48; background: var(--frame-dim); }
/* per-chapter notes under the matrix */
.notes { display: grid; gap: 6px; margin-top: 8px; }
.notes details { background: var(--ink-2); border: 2px solid #0007; }
.notes summary { cursor: pointer; padding: 6px 10px; font-size: var(--fs-s); }
.notes summary .num { font-size: .55rem; color: var(--gold); margin-right: 4px; }
.notes summary small { color: var(--dim); font-size: var(--fs-xs); }
.n-row { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 8px; padding: 8px 10px; border-top: 1px dashed #ffffff22; }
.n-row .mini { width: 32px; height: 32px; display: grid; place-items: end center; }
.n-row .spr-wrap { animation: none; }
.n-row .spr-wrap canvas { width: 32px; height: 32px; }

@keyframes arrow-hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

    var credit = c.image && (c.image.credit || c.image.url);
    dlg.innerHTML =
      '<div class="dlg-head"><div class="portrait rar-' + esc(c.rarity) + '">' + spr("char", c.id, 36) + "</div>" +
      '<div class="who"><div class="name-row"><b class="name" id="dlg-name" style="font-size:var(--fs-xl)">' + esc(c.name) + "</b>" + rarTag(c.rarity) + "</div>" +
      '<div class="orig">' + esc(c.nameOriginal) + '</div><div class="tags">' + elTag(c.element) + (c.role ? '<span class="tag">' + esc(c.role) + "</span>" : "") + "</div>" +
      '<dl class="facts">' + (c.howToGet ? "<dt>獲得</dt><dd>" + esc(c.howToGet) + "</dd>" : "") + (c.notes ? "<dt>備註</dt><dd>" + esc(c.notes) + "</dd>" : "") +
      (credit ? "<dt>圖片</dt><dd>" + esc(credit) + "</dd>" : "") + "</dl></div>" +
      '<button class="x" id="dlg-close" aria-label="關閉">X</button></div>' +
      '<p class="win-title" style="margin-top:16px">ROUTE · 每隻' + esc(T.phantom) + "逐章目標</p>" + matrix +
      (notes ? '<p class="win-title" style="margin-top:16px">NOTES · 逐章理由</p><div class="notes">' + notes + "</div>" : "") +
      (srcs.length ? '<div class="src" style="margin-top:12px">來源：<ol>' + srcs.map(srcItem).join("") + "</ol></div>" : "");
    mountSprites(dlg);
    lastFocus = document.activeElement;
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    document.getElementById("dlg-close").focus();
    var mw = document.getElementById("matrix-wrap"), mn = document.getElementById("matrix-now");
    if (mw && mn) mw.scrollLeft = Math.max(0, mn.offsetLeft - mw.querySelector("thead .m-v").offsetWidth);
  }
  function closeDetail() { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); }
  dlg.addEventListener("close", function () { if (lastFocus && lastFocus.focus) lastFocus.focus(); });
  dlg.addEventListener("click", function (e) {
    if (e.target.id === "dlg-close") { closeDetail(); return; }
    if (e.target !== dlg) return;
    var r = dlg.getBoundingClientRect();   // only close on true backdrop clicks
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeDetail();
  });

  /* ================= events ================= */
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var wipe = document.getElementById("wipe"), wiping = false;
  function setChapter(id) {
    if (!chapterById[id] || id === state.chapterId) return;
    state.chapterId = id; save();
    if (reduce || wiping) { renderAll(); return; }
    wiping = true;
    wipe.classList.remove("go"); void wipe.offsetWidth; wipe.classList.add("go");
    setTimeout(function () { renderAll(); var f = document.querySelector('.node[aria-checked="true"]'); if (f) f.focus({ preventScroll: true }); }, 210);
    setTimeout(function () { wipe.classList.remove("go"); wiping = false; }, 480);
  }
  var map = document.getElementById("map");
  map.addEventListener("click", function (e) { var n = e.target.closest(".node"); if (n) setChapter(n.getAttribute("data-ch")); });
  map.addEventListener("keydown", function (e) {
    var i = chapters.findIndex(function (c) { return c.id === state.chapterId; }), j = i;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") j = Math.min(chapters.length - 1, i + 1);
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") j = Math.max(0, i - 1);
    else if (e.key === "Home") j = 0; else if (e.key === "End") j = chapters.length - 1; else return;
    e.preventDefault(); if (j !== i) setChapter(chapters[j].id);
  });

  function setTab(t) {
    var fromChallenge = state.tab === "challenge";
    state.tab = t; save(); syncToolbar(); renderPanel();
    if (fromChallenge && t !== "challenge") {   /* the map was display:none, so re-centre the pin */
      var sc = document.querySelector(".map-scroll"), pin = document.querySelector('.node[aria-checked="true"]');
      if (sc && pin) sc.scrollLeft = pin.offsetLeft - (sc.clientWidth - pin.offsetWidth) / 2;
    }
  }
  function visibleTabs() { return ["chars", "phantoms"].concat(CHALLENGES.length ? ["challenge"] : []); }
  visibleTabs().forEach(function (t) { document.getElementById("tab-" + t).addEventListener("click", function () { setTab(t); }); });
  document.querySelector(".tabs").addEventListener("keydown", function (e) {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    var tabs = visibleTabs(), i = tabs.indexOf(state.tab), n = tabs.length;
    var t = tabs[(i + (e.key === "ArrowRight" ? 1 : n - 1)) % n]; setTab(t); document.getElementById("tab-" + t).focus();
  });

  document.getElementById("sort").addEventListener("click", function (e) {
    var b = e.target.closest("[data-sort]"); if (!b) return; state.sort = b.getAttribute("data-sort"); save(); syncToolbar(); renderPanel();
  });
  document.getElementById("f-prio").addEventListener("click", function (e) {
    var b = e.target.closest("[data-prio]"); if (!b) return;
    var p = b.getAttribute("data-prio"), i = state.prios.indexOf(p);
    if (i >= 0) { if (state.prios.length > 1) state.prios.splice(i, 1); } else state.prios.push(p);
    syncToolbar(); renderPanel();
  });
  document.getElementById("f-role").addEventListener("change", function (e) { state.role = e.target.value; renderPanel(); });
  document.getElementById("f-element").addEventListener("change", function (e) { state.element = e.target.value; renderPanel(); });
  document.getElementById("f-changes").addEventListener("change", function (e) { state.changesOnly = e.target.checked; renderPanel(); });
  document.getElementById("f-locked").addEventListener("change", function (e) { state.showLocked = e.target.checked; renderPanel(); });

  var grid = document.getElementById("grid");
  grid.addEventListener("click", function (e) {
    if (e.target.id === "reset") {
      state.role = ""; state.element = ""; state.prios = ["core", "recommended", "optional"]; state.changesOnly = false; state.showLocked = true;
      document.getElementById("f-role").value = ""; document.getElementById("f-element").value = "";
      document.getElementById("f-changes").checked = false; document.getElementById("f-locked").checked = true;
      syncToolbar(); renderPanel(); return;
    }
    var f = e.target.closest("[data-fold]");
    if (f) {
      var id = f.getAttribute("data-fold"), list = f.parentNode.querySelector(".vlist");
      state.open[id] = !state.open[id];
      list.classList.toggle("open", state.open[id]);
      f.setAttribute("aria-expanded", state.open[id]);
      return;
    }
    var t = e.target.closest("[data-char]"); if (t) openDetail(t.getAttribute("data-char"));
  });
  document.getElementById("challenge").addEventListener("click", function (e) {
    var q = e.target.closest("[data-challenge]");
    if (q) { state.challengeId = q.getAttribute("data-challenge"); save(); renderPanel(); return; }
    var t = e.target.closest("[data-char]"); if (t) openDetail(t.getAttribute("data-char"));
  });

  /* ================= back to top ================= */
  var toTop = document.getElementById("to-top");
  function syncToTop() { toTop.classList.toggle("show", window.scrollY > 400); }
  window.addEventListener("scroll", syncToTop, { passive: true });
  toTop.addEventListener("click", function () {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
  });
  syncToTop();

  /* ================= boot ================= */
  renderMeta(); buildToolbar(); renderAll();
})();
</script>
